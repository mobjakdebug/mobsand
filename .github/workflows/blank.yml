name: Deploy to Netlify

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile number (1-7)'
        required: false
        default: '1'
        type: choice
        options:
          - '1' # EDGE LOW PING ECO
          - '2' # EDGE LOW PING OPEN  
          - '3' # EDGE LOW PING LONG
          - '4' # FUNCTION ECO CREDITS
          - '5' # FUNCTION BALANCED
          - '6' # FUNCTION HIGH CONN
          - '7' # FUNCTION MAX STABILITY
      target_domain:
        description: 'Target domain URL (e.g., https://your-domain.com:443)'
        required: true
        type: string
      site_name:
        description: 'Netlify site name (leave empty to auto-generate)'
        required: false
        type: string
      site_id:
        description: 'Existing Netlify site ID (leave empty to create new)'
        required: false
        type: string
      relay_key:
        description: 'RELAY_KEY (optional, leave empty to skip)'
        required: false
        type: string
      public_relay_path:
        description: 'Public relay path (default: /api)'
        required: false
        type: string
        default: '/api'
      netlify_auth_token:
        description: 'Netlify Personal Access Token'
        required: true
        type: string

jobs:
  deploy:
    runs-on: windows-latest
    
    env:
      NON_INTERACTIVE: 'true'
      NETLIFY_AUTH_TOKEN: ${{ inputs.netlify_auth_token }}
    
    steps:
      - name: Download project files
        run: |
          $url = "https://github.com/amirshaker000/netlify-relay/releases/download/v2.0.0/netlify-installer-v2.0.0.zip"
          $zipPath = "${{ runner.temp }}\netlify-installer.zip"
          $extractPath = "${{ runner.temp }}\netlify-extract"
          
          Write-Host "Downloading project files..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          
          Write-Host "Creating extract directory..."
          New-Item -ItemType Directory -Force -Path $extractPath
          
          Write-Host "Extracting project files..."
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          
          Write-Host "Checking extracted files..."
          Get-ChildItem -Path $extractPath -Recurse | Select-Object FullName
          
          # Check if files are in a subfolder
          $packageJson = Get-ChildItem -Path $extractPath -Recurse -Filter "package.json" | Select-Object -First 1
          
          if ($packageJson) {
            $sourceDir = $packageJson.DirectoryName
            Write-Host "Found package.json in: $sourceDir"
            Write-Host "Copying all files to workspace..."
            Copy-Item -Path "$sourceDir\*" -Destination "${{ github.workspace }}" -Recurse -Force
          } else {
            Write-Host "package.json not found in extracted files!"
            throw "package.json not found"
          }
          
          Write-Host "Files in workspace:"
          Get-ChildItem -Path "${{ github.workspace }}" | Select-Object Name
        shell: pwsh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: List workspace contents
        run: |
          Write-Host "Workspace contents:"
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Depth 1 | Select-Object FullName
        shell: pwsh

      - name: Install dependencies
        run: |
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Looking for package.json..."
          if (Test-Path "package.json") {
            Write-Host "package.json found!"
            Get-Content package.json | Write-Host
          } else {
            Write-Host "package.json NOT found!"
            Get-ChildItem | Select-Object Name
            throw "package.json not found in current directory"
          }
          npm install --verbose
        shell: pwsh
        working-directory: ${{ github.workspace }}

      - name: Deploy to Netlify
        env:
          INPUT_PROFILE: ${{ inputs.profile || '1' }}
          INPUT_TARGET_DOMAIN: ${{ inputs.target_domain }}
          INPUT_NETLIFY_SITE_NAME: ${{ inputs.site_name || '' }}
          INPUT_NETLIFY_SITE_ID: ${{ inputs.site_id || '' }}
          INPUT_RELAY_KEY: ${{ inputs.relay_key || '' }}
          INPUT_PUBLIC_RELAY_PATH: ${{ inputs.public_relay_path || '/api' }}
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          if (Test-Path "Deploy-Netlify.ps1") {
            Write-Host "Deploy-Netlify.ps1 found!"
            .\Deploy-Netlify.ps1
          } else {
            Write-Host "Deploy-Netlify.ps1 NOT found!"
            Get-ChildItem -Recurse -Filter "*.ps1" | Select-Object FullName
            throw "Deploy-Netlify.ps1 not found"
          }

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-debug-log
          path: ${{ github.workspace }}/netlify-installer-debug-*.log
